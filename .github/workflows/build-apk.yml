name: Build Android APK

# Runs only when started by hand (Actions tab → Build Android APK → Run workflow).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=${{ inputs.version }}
          --build-number=${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk NetMask-${{ inputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NetMask-${{ inputs.version }}
          path: NetMask-${{ inputs.version }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}-build${{ github.run_number }}
          name: NetMask ${{ inputs.version }} (build ${{ github.run_number }})
          prerelease: true
          files: NetMask-${{ inputs.version }}.apk
