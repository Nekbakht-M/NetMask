  const n=toInt(ip),m=maskInt(p),size=2**(32-p),net=Math.floor(n/size)*size,bc=net+size-1;
  const usable=p>=31?0:size-2;
  const b=bin32(m).match(/.{8}/g).join('.');
  const hex='0x'+n.toString(16).padStart(8,'0');
  const h=n.toString(16).padStart(8,'0');
  return {ip,net:toIp(net),range:usable?`${toIp(net+1)} - ${toIp(bc-1)}`:null,bc:toIp(bc),total:size,usable,mask:toIp(m),wild:toIp(2**32-1-m),bin:b,
    cls:ipClass(ip),cidr:'/'+p,priv:isPrivate(n),short:`${ip} /${p}`,
    binId:bin32(n),intId:String(n),hexId:hex,arpa:ip.split('.').reverse().join('.')+'.in-addr.arpa',
    mapped:`::ffff:${h.slice(0,4)}.${h.slice(4)}`,sixto4:`2002:${h.slice(0,4)}.${h.slice(4)}::/48`};
}
function networks(ip,p){
  const parent=Math.max(0,8*Math.floor((p-1)/8));const bits=Math.min(p-parent,8);const count=2**bits;
  const size=2**(32-p);const pn=Math.floor(toInt(ip)/2**(32-parent))*2**(32-parent);
  const oct=ip.split('.');const base=parent===0?'*.*.*.*':oct.slice(0,parent/8).join('.')+'.*'.repeat(4-parent/8);
  const rows=[];for(let i=0;i<count;i++){const net=pn+i*size,bc=net+size-1;rows.push([toIp(net),p>=31?'—':`${toIp(net+1)} – ${toIp(bc-1)}`,toIp(bc)])}
  return {base,rows,cur:Math.floor((toInt(ip)-pn)/size)};
}
/* ---------- IPv6 math ---------- */
function parse6(s){s=s.trim().toLowerCase();if(!/^[0-9a-f:]+$/.test(s)||(s.match(/::/g)||[]).length>1)return null;
  let [a,b]=s.includes('::')?s.split('::'):[s,null];const A=a?a.split(':'):[],B=b?b.split(':'):[];
  if(b===null&&A.length!==8)return null;const fill=8-A.length-B.length;if(b!==null&&fill<1)return null;
  const g=[...A,...Array(b!==null?fill:0).fill('0'),...B];if(g.length!==8||g.some(x=>!/^[0-9a-f]{1,4}$/.test(x)))return null;
  return g.reduce((acc,x)=>(acc<<16n)+BigInt('0x'+x),0n)}
const full6=n=>n.toString(16).padStart(32,'0').match(/.{4}/g).join(':');
function calc6(ip,p){const n=parse6(ip);const hostBits=BigInt(128-p);const size=1n<<hostBits;const net=(n>>hostBits)<<hostBits;const last=net+size-1n;
  const fn=full6(net).split(':');let keep=Math.ceil(p/16);const netStr=fn.slice(0,keep).join(':')+(keep<8?'::':'');
  return {ip:`${ip.trim()}/${p}`,full:full6(n),total:size.toLocaleString('en-US'),net:netStr,range:`${full6(net)} - ${full6(last)}`}}

/* ---------- state ---------- */
const store={get(k,d){try{const v=localStorage.getItem('nm_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nm_'+k,JSON.stringify(v))}catch(e){}}};
const S={lang:store.get('lang','tj'),theme:store.get('theme','dark'),tab:store.get('start','v4'),start:store.get('start','v4'),extraAlways:store.get('extra',false),
  cls:'C',p:30,ip:'192.168.1.1',err:false,r4:null,showMore:false,p6:64,ip6:'2001:db8:85a3::8a2e:370:7334',err6:false,r6:null,sheet:null,calcs:store.get('calcs',0),promoOff:store.get('promoOff',false),promo:false};
S.r4=calc4(S.ip,S.p);S.r6=calc6(S.ip6,S.p6);
const t=k=>T[S.lang][k];
const range=c=>c==='A'?[8,32]:c==='B'?[16,32]:c==='C'?[24,32]:[1,32];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function row(k,v,hi){return `<div class="row${hi?' hi':''}" data-copy="${esc(v)}" role="button" tabindex="0"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`}
function v4(){const [lo,hi]=range(S.cls);if(S.p<lo)S.p=lo;
  let opts='';for(let p=32;p>=lo;p--)opts+=`<option value="${p}"${p===S.p?' selected':''}>${toIp(maskInt(p))} /${p}</option>`;
  const r=S.r4,more=S.showMore||S.extraAlways;
  return `<section class="card"><h2>${t('v4t')}</h2>
  <div><span class="lbl">${t('cls')}</span><div class="chips" role="group">${['Any','A','B','C'].map(c=>`<button class="chip" data-cls="${c}" aria-pressed="${S.cls===c}">${c==='Any'?t('any'):c}</button>`).join('')}</div></div>
  <div><label class="lbl" for="sub">${t('sub')}</label><select id="sub">${opts}</select></div>
  <div><label class="lbl" for="ip4">${t('ip')}</label><input id="ip4" type="text" inputmode="decimal" autocomplete="off" value="${esc(S.ip)}" class="${S.err?'bad':''}" placeholder="192.168.1.1">${S.err?`<div class="err">${t('err')}</div>`:''}</div>
  <div class="actions"><button class="primary" id="go4">${t('calc')} ${PLAY}</button><button class="ghost" id="clr4">${t('clear')}</button></div></section>
  ${r?`<section class="card"><div class="res">
  ${row(t('r_ip'),r.ip)}${row(t('r_net'),r.net,1)}${row(t('r_range'),r.range||t('na'))}${row(t('r_bc'),r.bc,1)}${row(t('r_total'),r.total.toLocaleString('ru-RU'))}${row(t('r_usable'),r.usable.toLocaleString('ru-RU'))}
  ${row(t('r_mask'),r.mask)}${row(t('r_wild'),r.wild)}${row(t('r_bin'),r.bin)}${row(t('r_class'),r.cls)}${row(t('r_cidr'),r.cidr)}${row(t('r_type'),r.priv?t('priv'):t('pub'))}${row(t('r_short'),r.short)}
  ${more?row('Binary ID',r.binId)+row('Integer ID',r.intId)+row('Hex ID',r.hexId)+row('in-addr.arpa',r.arpa)+row('IPv4 Mapped',r.mapped)+row('6to4 Prefix',r.sixto4):''}
  </div>${S.extraAlways?'':`<button class="more" id="more">${S.showMore?t('less'):t('more')}</button>`}
  <div class="tools"><button class="sec" id="nets">${t('all')}</button><button class="sec" id="share">${t('share')}</button></div></section>`:''}`}
function v6(){let opts='';for(let p=128;p>=1;p--)opts+=`<option value="${p}"${p===S.p6?' selected':''}>/${p}</option>`;const r=S.r6;
  return `<section class="card"><h2>${t('v6t')}</h2>
  <div><label class="lbl" for="p6">${t('pfx')}</label><select id="p6">${opts}</select></div>
  <div><label class="lbl" for="ip6">${t('ip')}</label><input id="ip6" type="text" autocomplete="off" autocapitalize="off" value="${esc(S.ip6)}" class="${S.err6?'bad':''}">${S.err6?`<div class="err">${t('err')}</div>`:''}</div>
  <div class="actions"><button class="primary" id="go6">${t('calc')} ${PLAY}</button><button class="ghost" id="clr6">${t('clear')}</button></div></section>
  ${r?`<section class="card"><div class="res">${row(t('r_ip'),r.ip)}${row(t('r6_full'),r.full)}${row(t('r6_total'),r.total)}${row(t('r6_net'),r.net,1)}${row(t('r6_range'),r.range)}</div></section>`:''}`}
function netSheet(){const n=networks(S.r4.ip,S.p);
  return `<div class="sheet"><div class="app"><header><button class="iconbtn" data-close aria-label="Back">${BACK}</button><div class="nhead"><h2>${t('netsT')(S.p)}</h2><span>${t('netsS')(n.rows.length,n.base)}</span></div></header>
  <div class="nlist"><div class="ntools"><button class="jump" id="jump">${t('jump')}</button><button class="xlsbtn" id="xls">${XLS} ${t('xls')}</button></div>
  ${n.rows.map((r,i)=>`<div class="nitem${i===n.cur?' cur':''}"${i===n.cur?' id="mine"':''}><div class="t"><b>${r[0]}/${S.p}</b><small>#${i+1}</small></div>
   <div class="l"><em>${t('hosts')}</em><span>${r[1]}</span></div><div class="l"><em>${t('c_bc')}</em><span>${r[2]}</span></div></div>`).join('')}</div></div></div>`}
const SI={lang:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
 theme:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',start:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
 extra:'<path d="M4 6h16M4 12h16M4 18h10"/>'};
const sico=k=>`<span class="sico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SI[k]}</svg></span>`;
function xlsData(){const n=networks(S.r4.ip,S.p);return {n,name:`NetMask_${n.rows[0][0]}_${S.p}.xlsx`,
  head:['#',t('c_net'),'CIDR',t('c_range'),t('c_bc'),t('r_mask'),t('r_usable')],
  rows:n.rows.map((r,i)=>[i+1,r[0],'/'+S.p,r[1],r[2],toIp(maskInt(S.p)),S.p>=31?0:2**(32-S.p)-2])}}
function xlsModal(){const d=xlsData();
  return `<div class="modal" id="xlsbg"><div class="in" role="dialog" aria-label="${t('xlsT')}"><b>${t('xlsT')}</b>
  <div class="file"><div class="x">XLS</div><div><b>${d.name}</b><small>${d.rows.length} × ${d.head.length}</small></div></div>
  <div class="prev"><table><thead><tr>${d.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${d.rows.slice(0,4).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}<tr><td colspan="${d.head.length}">…</td></tr></tbody></table></div>
  <span style="color:var(--fg2);font-size:13.5px">${t('xlsB')}</span>
  <div class="promo-btns" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="sec" id="xlscopy">${t('copyT')}</button><button class="ghost" id="xlsclose">${t('close')}</button></div></div></div>`}
function setSheet(){const seg=(name,cur,items)=>`<div class="segc" role="radiogroup" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(([v,l])=>`<button role="radio" data-set="${name}" data-val="${v}" aria-checked="${cur===v}">${l}</button>`).join('')}</div>`;
  return `<div class="sheet"><div class="app"><header><button class="iconbtn" data-close aria-label="Back">${BACK}</button><h2>${t('set')}</h2></header>
  <section class="card slist">
   <div class="srow"><div class="shead">${sico('lang')}<span>${t('lang')}</span></div>${seg('lang',S.lang,[['tj','Тоҷикӣ'],['ru','Русский'],['en','English']])}</div>
   <div class="srow"><div class="shead">${sico('theme')}<span>${t('theme')}</span></div>${seg('theme',S.theme,[['dark',t('dark')],['light',t('light')]])}</div>
   <div class="srow"><div class="shead">${sico('start')}<span>${t('start')}</span></div>${seg('start',S.start,[['v4','IPv4'],['v6','IPv6']])}</div>
   <div class="srow inline"><div class="shead">${sico('extra')}<span>${t('extra')}</span></div>
    <button class="switch" role="switch" aria-checked="${S.extraAlways}" data-set="extra" data-val="${!S.extraAlways}" aria-label="${t('extra')}"><i></i></button></div>
  </section>
  <section class="card"><span class="lbl">${t('dev')}</span><div class="dev"><div class="who"><div class="ava">N</div><div><b>Neka</b><p>Telegram</p></div></div>
   <p>${t('devtxt')}</p><a class="tg" href="https://t.me/Neka_m" target="_blank" rel="noopener">${TG} ${t('order')}</a></div></section>
  <section class="card"><span class="lbl">${t('about')}</span><div class="res">${row('NetMask',t('ver')+' 1.0.0')}${row(t('created'),'Neka')}</div></section>
  </div></div>`}

function render(){
  document.documentElement.classList.toggle('light',S.theme==='light');
  const showPromo=S.promo&&!S.promoOff;
  document.getElementById('root').innerHTML=`<div class="app">
   <header><div class="logo">${ICON}</div><div class="brand">NetMask</div><button class="iconbtn" id="gear" aria-label="${t('set')}">${GEAR}</button></header>
   <div class="seg" role="tablist"><button role="tab" data-tab="v4" aria-selected="${S.tab==='v4'}">IPv4</button><button role="tab" data-tab="v6" aria-selected="${S.tab==='v6'}">IPv6</button></div>
   ${S.tab==='v4'?v4():v6()}
   <div class="foot"><a class="by" href="https://t.me/Neka_m" target="_blank" rel="noopener">${t('madeby')} ${TG}</a></div>
   <div class="proto">Прототип: значения можно копировать нажатием на строку.</div></div>
   ${S.sheet==='nets'?netSheet():''}${S.xls?xlsModal():''}${S.sheet==='set'?setSheet():''}
   ${showPromo?`<div class="promo"><div class="in"><b>${t('promoT')}</b><span style="color:var(--fg2)">${t('promoB')}</span><div class="btns"><a class="tg" href="https://t.me/Neka_m" target="_blank" rel="noopener">${TG} ${t('write')}</a><button class="ghost" id="never">${t('never')}</button></div></div></div>`:''}`;
}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}
function counted(){S.calcs++;store.set('calcs',S.calcs);if(S.calcs===10&&!S.promoOff)S.promo=true}

document.addEventListener('click',e=>{const el=e.target.closest('button,[data-copy],a');if(!el)return;
  if(el.dataset.tab){S.tab=el.dataset.tab;return render()}
  if(el.dataset.cls){S.cls=el.dataset.cls;const [lo]=range(S.cls);if(S.p<lo)S.p=lo;return render()}
  if(el.id==='go4'){S.ip=document.getElementById('ip4').value.trim();S.p=+document.getElementById('sub').value;
    if(!validV4(S.ip)){S.err=true;S.r4=null}else{S.err=false;S.r4=calc4(S.ip,S.p);counted()}return render()}
  if(el.id==='clr4'){S.ip='';S.r4=null;S.err=false;return render()}
  if(el.id==='go6'){S.ip6=document.getElementById('ip6').value.trim();S.p6=+document.getElementById('p6').value;
    if(parse6(S.ip6)===null){S.err6=true;S.r6=null}else{S.err6=false;S.r6=calc6(S.ip6,S.p6);counted()}return render()}
  if(el.id==='clr6'){S.ip6='';S.r6=null;S.err6=false;return render()}
  if(el.id==='more'){S.showMore=!S.showMore;return render()}
  if(el.id==='nets'){S.sheet='nets';render();const m=document.getElementById('mine');if(m)m.scrollIntoView({block:'center'});return}
  if(el.id==='xls'){S.xls=true;return render()}
  if(el.id==='xlsclose'){S.xls=false;return render()}
  if(el.id==='xlscopy'){const d=xlsData();copy([d.head,...d.rows].map(r=>r.join('\t')).join('\n'));return}
  if(el.id==='jump'){const m=document.getElementById('mine');if(m)m.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(el.id==='gear'){S.sheet='set';return render()}
  if(el.hasAttribute('data-close')){S.sheet=null;S.xls=false;return render()}
  if(el.id==='never'){S.promoOff=true;S.promo=false;store.set('promoOff',true);return render()}
  if(el.dataset.set){let v=el.dataset.val;if(v==='true')v=true;if(v==='false')v=false;const k=el.dataset.set;
    if(k==='lang')S.lang=v;if(k==='theme')S.theme=v;if(k==='start')S.start=v;if(k==='extra')S.extraAlways=v;store.set(k,v);return render()}
  if(el.id==='share'){const r=S.r4;const txt=`${r.short}\n${t('r_net')}: ${r.net}\n${t('r_range')}: ${r.range||t('na')}\n${t('r_bc')}: ${r.bc}\n${t('r_mask')}: ${r.mask}\n— NetMask · t.me/Neka_m`;copy(txt);return}
  if(el.dataset.copy!==undefined){copy(el.dataset.copy)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='ip4')document.getElementById('go4').click();if(e.target.id==='ip6')document.getElementById('go6').click();
  if(e.target.dataset&&e.target.dataset.copy!==undefined)copy(e.target.dataset.copy)}});
document.addEventListener('change',e=>{if(e.target.id==='sub'){S.p=+e.target.value}if(e.target.id==='p6'){S.p6=+e.target.value}});
/* IPv4 input: dots are added automatically, a typed dot is never doubled, comma/space count as dot */
let prevIp='';
function fmtIp(raw,adding){
  let v=raw.replace(/[,\s]/g,'.').replace(/[^0-9.]/g,'').replace(/\.{2,}/g,'.').replace(/^\./,'');
  const parts=[];let cur='';
  for(const ch of v){if(ch==='.'){if(parts.length<3){parts.push(cur);cur=''}continue}
    if(cur.length===3||(cur==='0')||(cur.length&&+(cur+ch)>255)){if(parts.length<3){parts.push(cur);cur=ch}continue}
    cur+=ch}
  let out=[...parts,cur].join('.');if(v.endsWith('.')&&parts.length<=3&&!out.endsWith('.')&&cur==='')out+='.';
  const last=cur;
  if(adding&&parts.length<3&&last&&(last.length===3||last==='0'||+last*10>255))out+='.';
  return out;
}
document.addEventListener('input',e=>{if(e.target.id!=='ip4')return;const el=e.target;const adding=el.value.length>prevIp.length;
  const f=fmtIp(el.value,adding);el.value=f;prevIp=f;el.classList.remove('bad')});
document.addEventListener('focusin',e=>{if(e.target.id==='ip4')prevIp=e.target.value});
function copy(txt){const done=()=>toast(t('copied'));try{navigator.clipboard.writeText(txt).then(done,done)}catch(e){done()}}
render();
</script>
